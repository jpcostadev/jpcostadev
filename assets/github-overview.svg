<svg xmlns="http://www.w3.org/2000/svg" width="480" height="230" viewBox="0 0 480 230" role="img" aria-labelledby="title desc">
  <title id="title">Visão geral do GitHub de João Pedro Costa</title>
  <desc id="desc">695 contribuições desde 2022 e 17 repositórios públicos</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="478" height="228" rx="16" fill="url(#bg)" stroke="#30363d"/>
  <rect x="0" y="0" width="480" height="4" rx="2" fill="url(#accent)"/>
  <text x="28" y="42" fill="#e6edf3" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Visão geral</text>
  <circle cx="438" cy="35" r="5" fill="#06b6d4" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/></circle>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="88" y="110" fill="#67e8f9" font-size="34" font-weight="800">695</text>
    <text x="88" y="137" fill="#8b949e" font-size="13">CONTRIBUIÇÕES</text>
    <text x="240" y="110" fill="#a78bfa" font-size="34" font-weight="800">17</text>
    <text x="240" y="137" fill="#8b949e" font-size="13">REPOSITÓRIOS</text>
    <text x="392" y="110" fill="#67e8f9" font-size="34" font-weight="800">2022</text>
    <text x="392" y="137" fill="#8b949e" font-size="13">DESDE</text>
  </g>
  <line x1="164" y1="82" x2="164" y2="143" stroke="#30363d"/>
  <line x1="316" y1="82" x2="316" y2="143" stroke="#30363d"/>
  <rect x="28" y="177" width="424" height="8" rx="4" fill="#21262d"/>
  <rect x="28" y="177" width="424" height="8" rx="4" fill="url(#accent)">
    <animate attributeName="width" from="0" to="424" dur="1.4s" fill="freeze"/>
  </rect>
  <text x="28" y="207" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="12">Dados públicos atualizados em setembro de 2026</text>
</svg>
